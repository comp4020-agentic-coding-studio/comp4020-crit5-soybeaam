<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gap Hop</title>
    <meta
      name="description"
      content="Gap Hop: a one-button runner where you tap to jump gaps before you fall in."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Gap Hop</h1>
      <canvas id="runner"></canvas>

      <div id="hud" class="hud hidden">
        <span id="score">0</span>
        <span id="best-label">best <span id="best">0</span></span>
      </div>

      <div id="menu" class="overlay">
        <div class="overlay-card">
          <h2>Gap&nbsp;Hop</h2>
          <p>Tap, click, or press Space to jump the gaps.</p>
          <p>Don't fall in.</p>
          <button id="start-btn" type="button">Tap to Play</button>
        </div>
      </div>

      <div id="gameover" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="gameover-title">You fell!</h2>
          <p>Score: <span id="final-score">0</span></p>
          <p>Best: <span id="final-best">0</span></p>
          <button id="restart-btn" type="button">Restart</button>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
